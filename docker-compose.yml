services:
  fileserver:
    build: .
    image: fileserver:latest
    container_name: fileserver
    restart: unless-stopped
    ports:
      - "${FILESERVER_PORT:-8080}:8080"
    environment:
      # Каталог с книгами внутри контейнера (точка монтирования тома ниже).
      BOOKS_DIR: /data
      FILESERVER_REFRESH_INTERVAL_SECONDS: "${FILESERVER_REFRESH_INTERVAL_SECONDS:-5}"
    volumes:
      # Каталог с книгами на хосте. По умолчанию — ./books рядом с compose-файлом.
      - "${BOOKS_HOST_DIR:-./books}:/data:ro"
