plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ars.home.ai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'dev.langchain4j:langchain4j-bom:1.24.0'
	}
}

dependencies {
	implementation 'dev.langchain4j:langchain4j-spring-boot4-starter:1.24.0-beta34'
	implementation 'dev.langchain4j:langchain4j-open-ai-spring-boot4-starter:1.24.0-beta34'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
