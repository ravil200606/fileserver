spring:
  main:
    web-application-type: none

langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
      api-key: ${LLM_API_KEY:${OPENAI_API_KEY}}
      model-name: ${LLM_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
      log-requests: true
      log-responses: true

fileserver:
  base-url: ${FILESERVER_BASE_URL:http://localhost:8080}

logging:
  level:
    ars.home.aiagent: DEBUG
